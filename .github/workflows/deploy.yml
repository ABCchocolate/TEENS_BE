name: Java CI/CD with Gradle

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Gradle 실행 권한 부여 및 빌드 (테스트 제외로 속도 향상 선택 가능)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      # JAR 파일 전송 (strip_components로 경로 단순화)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2 # build/libs 경로를 제외하고 파일만 전송

      # EC2에서 배포 스크립트 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 기존 실행 중인 Java 프로세스 종료 (없으면 통과)
            fuser -k 8080/tcp || true
            
            # 새 JAR 실행 (nohup으로 백그라운드 실행)
            # systemctl을 쓰신다면 해당 서비스가 이 위치의 JAR를 바라보게 설정되어 있어야 합니다.
            nohup java -jar /home/ubuntu/app/*.jar > /home/ubuntu/app/nohup.out 2>&1 &