name: Java CI/CD with Gradle

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      # Java 17.0.18 강제 설정
      - name: Set up JDK 17.0.18
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17.0.18'
          cache: none

      # Java 버전 확인 (반드시 17이어야 함)
      - name: Verify Java version
        run: java -version

      # Gradle이 사용하는 JVM 확인 (중요)
      - name: Verify Gradle JVM version
        run: ./gradlew -version

      # 빌드 (캐시 완전 차단)
      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-build-cache

      # JAR EC2로 복사
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2

      # 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR=/home/ubuntu/app
            PID_FILE=$APP_DIR/app.pid

            # 실행 가능한 JAR만 선택 (plain 제외)
            JAR_FILE=$(ls $APP_DIR/*.jar | grep -v plain | head -n 1)

            # 기존 앱 종료
            if [ -f "$PID_FILE" ]; then
              PID=$(cat $PID_FILE)
              if ps -p $PID > /dev/null; then
                kill $PID
                sleep 3
              fi
              rm -f $PID_FILE
            fi

            # 앱 실행
            nohup java -jar $JAR_FILE > $APP_DIR/nohup.out 2>&1 &

            echo $! > $PID_FILE
