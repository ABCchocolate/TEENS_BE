name: Java CI/CD with Gradle

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      # Java 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      
      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      
      # Java 버전 확인
      - name: Verify Java version
        run: java -version
      
      # Gradle 버전 확인
      - name: Verify Gradle JVM version
        run: ./gradlew -version
      
      # 빌드 (테스트 제외, 캐시 사용 안 함)
      - name: Build with Gradle
        run: ./gradlew clean build -x test --no-build-cache
      
      # JAR 파일을 EC2로 복사
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"
          strip_components: 2
      
      # EC2에 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR=/home/ubuntu/app
            PID_FILE=$APP_DIR/app.pid
            ENV_FILE=$APP_DIR/.env
            JAR_FILE=$(ls $APP_DIR/*.jar | grep -v plain | head -n 1)
            
            # 기존 프로세스 종료
            if [ -f "$PID_FILE" ]; then
              PID=$(cat $PID_FILE)
              if ps -p $PID > /dev/null 2>&1; then
                echo "Stopping existing process (PID: $PID)..."
                kill $PID
                sleep 3
              fi
              rm -f $PID_FILE
            fi
            
            # .env 파일 존재 확인
            if [ ! -f "$ENV_FILE" ]; then
              echo "Warning: .env file not found at $ENV_FILE"
            fi
            
            # .env 파일을 환경변수로 로드하여 애플리케이션 시작
            echo "Starting application with .env file..."
            if [ -f "$ENV_FILE" ]; then
              # .env 파일의 내용을 export하여 환경변수로 설정
              set -a
              source $ENV_FILE
              set +a
              nohup java -jar $JAR_FILE > $APP_DIR/nohup.out 2>&1 &
            else
              # .env 파일이 없으면 그냥 실행
              nohup java -jar $JAR_FILE > $APP_DIR/nohup.out 2>&1 &
            fi
            
            echo $! > $PID_FILE
            echo "Application started with PID: $(cat $PID_FILE)"
